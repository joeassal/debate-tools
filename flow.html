<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardFlow</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Calibri, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-bottom: 1px solid #d6dcea;
      background: #ffffff;
      flex: 0 0 auto;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .toolbar button {
      min-height: 26px;
      border: 1px solid #c6cfdf;
      background: #f8fafc;
      border-radius: 4px;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      color: #1f2937;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .toolbar button:hover {
      background: #eef2ff;
      border-color: #95a3d6;
    }

    .toolbar button:focus-visible,
    .tab:focus-visible,
    .tab-action:focus-visible,
    .speech-order-label input:focus {
      outline: none;
      border-color: #2d3c80;
      box-shadow: 0 0 0 2px rgba(45, 60, 128, 0.16);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .speech-order-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      font-size: 11px;
      white-space: nowrap;
    }

    .speech-order-label input {
      width: 190px;
      min-height: 26px;
      padding: 4px 7px;
      border: 1px solid #c6cfdf;
      border-radius: 4px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 11px;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid #d6dcea;
      background: #ffffff;
      overflow-x: auto;
      flex: 0 0 auto;
    }

    #tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .tab {
      border: 1px solid #c6cfdf;
      background: #f8fafc;
      border-radius: 4px;
      font-size: 11px;
      padding: 5px 9px;
      cursor: pointer;
      white-space: nowrap;
      color: #263246;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .tab:hover {
      background: #eef2ff;
      border-color: #95a3d6;
    }

    .tab.active {
      background: #2d3c80;
      border-color: #2d3c80;
      color: #ffffff;
    }

    .tab-action {
      width: 24px;
      height: 24px;
      border: 1px solid #c6cfdf;
      background: #f8fafc;
      border-radius: 4px;
      cursor: pointer;
      flex: 0 0 auto;
      color: #263246;
      line-height: 1;
    }

    .tab-action:hover {
      background: #eef2ff;
    }

    .sheet-wrap {
      flex: 1 1 auto;
      overflow: auto;
    }

    .sheet {
      min-width: 720px;
      display: grid;
      align-items: stretch;
      background: #d9dee8;
    }

    .corner,
    .col-head,
    .row-head {
      background: #eef2f7;
      border-right: 1px solid #cfd6e4;
      border-bottom: 1px solid #cfd6e4;
      color: #475569;
      font-size: 11px;
      line-height: 28px;
      text-align: center;
      user-select: none;
    }

    .corner,
    .col-head {
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 700;
    }

    .corner {
      left: 0;
      z-index: 3;
    }

    .row-head {
      position: sticky;
      left: 0;
      z-index: 1;
    }

    .cell {
      width: 100%;
      min-height: 44px;
      field-sizing: content;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 0;
      border-right: 1px solid #d9dee8;
      border-bottom: 1px solid #d9dee8;
      padding: 5px 6px;
      font: inherit;
      font-size: 12px;
      line-height: 15px;
      color: #111827;
      background: #ffffff;
      outline: none;
      transition: background-color 0.12s, box-shadow 0.12s;
    }

    .cell.col-even {
      background: #ffffff;
      color: #1d4ed8;
    }

    .cell.col-odd {
      background: #f8fafc;
      color: #b91c1c;
    }

    .cell:focus {
      box-shadow: inset 0 0 0 2px #2d3c80;
      background: #fbfdff;
    }

    @media (max-width: 760px) {
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="toolbar">
      <div class="title">Flow</div>
      <div class="toolbar-actions">
        <label class="speech-order-label">Speech Order <input type="text" id="speechOrder" placeholder="1AC,1NC,2AR,2NR,2AR"></label>
        <button id="export-flow" type="button">Export</button>
        <button id="import-flow" type="button">Import</button>
        <input id="import-flow-file" type="file" accept="application/json,.json" hidden>
        <button id="clear-flows" type="button">Clear All</button>
        <button id="add-row" type="button">Add Row</button>
      </div>
    </div>
    <div class="tabs">
      <div id="tabs"></div>
      <button id="add-tab" class="tab-action" type="button" title="Add Tab">+</button>
      <button id="delete-tab" class="tab-action" type="button" title="Delete Tab">x</button>
    </div>
    <div class="sheet-wrap">
      <div id="sheet" class="sheet"></div>
    </div>
  </main>

  <script src="flow.js"></script>
</body>
</html>
